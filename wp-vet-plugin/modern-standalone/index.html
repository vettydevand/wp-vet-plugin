<!DOCTYPE html>
<html>
<head>
    <title>WP Vet Calendar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/fullcalendar/3.10.2/fullcalendar.min.css" />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.24.0/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fullcalendar/3.10.2/fullcalendar.min.js"></script>
</head>
<body>

<div id="calendar"></div>

<!-- Modal -->
<div id="appointmentModal" class="modal">
    <div class="modal-content">
        <span class="close-button">&times;</span>
        <h2 id="modalTitle"></h2>
        <form id="appointmentForm">
            <input type="hidden" id="appointmentId">
            <label for="appointmentTitle">Title</label>
            <input type="text" id="appointmentTitle" required>
            <label for="appointmentStart">Start</label>
            <input type="datetime-local" id="appointmentStart" required>
            <label for="appointmentEnd">End</label>
            <input type="datetime-local" id="appointmentEnd" required>
            <button type="submit" id="saveButton">Save</button>
            <button type="button" id="deleteButton">Delete</button>
        </form>
    </div>
</div>

<script src="scripts.js"></script>
</body>
</html>
