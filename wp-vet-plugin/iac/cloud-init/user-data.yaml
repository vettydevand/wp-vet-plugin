#cloud-config
# Configurazione cloud-init per il deployment con Ansible

package_update: true
package_upgrade: true

packages:
  - git
  - ansible

runcmd:
  # 1. Clona il repository del progetto
  - git clone https://github.com/google-gemini/generative-ai-docs /var/www/html/wp-vet-plugin

  # 2. Esegui il playbook Ansible per configurare l'ambiente
  # Assumendo che il playbook sia nella root del repository clonato
  # e l'inventory sia configurato per localhost
  - ansible-playbook /var/www/html/wp-vet-plugin/wp-vet-plugin/iac/ansible/playbook.yml -i /var/www/html/wp-vet-plugin/wp-vet-plugin/iac/ansible/inventory.ini

