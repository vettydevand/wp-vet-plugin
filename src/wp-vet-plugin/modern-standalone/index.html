<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario Appuntamenti</title> <!-- Il titolo verrà aggiornato da JS -->
    <link href='https://unpkg.com/@fullcalendar/core@4.4.2/main.min.css' rel='stylesheet' />
    <link href='https://unpkg.com/@fullcalendar/daygrid@4.4.2/main.min.css' rel='stylesheet' />
    <link href='https://unpkg.com/@fullcalendar/timegrid@4.4.2/main.min.css' rel='stylesheet' />
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="app-header">
        <img id="appLogo" src="" alt="Logo" class="app-logo" style="display: none;" />
        <h1 id="appName">Calendario Appuntamenti</h1>
    </header>

    <div id="calendar"></div>

    <!-- Modale per Aggiungere/Modificare Appuntamento -->
    <div id="appointmentModal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h2 id="modalTitle">Aggiungi Appuntamento</h2>
            <form id="appointmentForm">
                <input type="hidden" id="appointmentId">
                <div>
                    <label for="appointmentTitle">Titolo:</label>
                    <input type="text" id="appointmentTitle" required>
                </div>
                <div>
                    <label for="appointmentStart">Inizio:</label>
                    <input type="datetime-local" id="appointmentStart" required>
                </div>
                <div>
                    <label for="appointmentEnd">Fine:</label>
                    <input type="datetime-local" id="appointmentEnd" required>
                </div>
                <div class="modal-buttons">
                    <button type="submit" id="saveButton">Salva</button>
                    <button type="button" id="deleteButton" style="display:none;">Elimina</button>
                </div>
            </form>
        </div>
    </div>

    <script src='https://unpkg.com/@fullcalendar/core@4.4.2/main.min.js'></script>
    <script src='https://unpkg.com/@fullcalendar/interaction@4.4.2/main.min.js'></script>
    <script src='https://unpkg.com/@fullcalendar/daygrid@4.4.2/main.min.js'></script>
    <script src='https://unpkg.com/@fullcalendar/timegrid@4.4.2/main.min.js'></script>
    <script src='https://unpkg.com/@fullcalendar/core/locales/it.js'></script>
    <script src="scripts.js"></script>

</body>
</html>
